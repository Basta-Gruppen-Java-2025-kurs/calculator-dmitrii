name: CI with H2 database

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["dev"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # checkout our code
      - name: checkout code
        uses: actions/checkout@v6

      # install right java version
      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # build and run tests
      - name: build and test
        run: mvn -B clean verify